name: "Ghast CI"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions: read-all

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    permissions: read-all
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    timeout-minutes: 15

    steps:    
    - name: Checkout repository
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.1
      with:
        persist-credentials: false
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"
        pip install -r requirements-dev.txt
      shell: bash

    - name: Run tests
      run: |
        pytest --cov=ghast ghast/tests/
      shell: bash

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
      shell: bash

    - name: Lint with flake8
      run: |
        flake8 ghast --count --select=E9,F63,F7,F82 --show-source --statistics
      shell: bash

    - name: Type check with mypy
      run: |
        mypy ghast
      shell: bash

  package:
    name: Wheel install smoke test
    permissions: read-all
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Build distributions
      run: |
        python -m pip install --upgrade pip build
        python -m build
      shell: bash

    # Installs the built wheel into a clean venv and runs it from a directory
    # outside the checkout, so nothing can resolve against the source tree.
    # This is what catches a wheel that is missing subpackages.
    - name: Install wheel into a clean environment and run it
      run: |
        set -euo pipefail
        workdir="$(mktemp -d)"
        python -m venv "$workdir/venv"
        "$workdir/venv/bin/pip" install --upgrade pip
        "$workdir/venv/bin/pip" install dist/*.whl

        mkdir -p "$workdir/fixture/.github/workflows"
        cat > "$workdir/fixture/.github/workflows/ci.yml" <<'YAML'
        name: Fixture
        on: [push]
        permissions: read-all
        jobs:
          build:
            runs-on: ubuntu-latest
            permissions: read-all
            timeout-minutes: 5
            steps:
              - run: echo hello
        YAML

        cd "$workdir"
        ./venv/bin/ghast --version
        ./venv/bin/ghast rules
        ./venv/bin/ghast scan fixture
        ./venv/bin/python -c "import ghast, ghast.core, ghast.rules, ghast.reports, ghast.utils; print('imports ok')"
      shell: bash

    - name: Verify tests are excluded from the wheel
      run: |
        set -euo pipefail
        if python -c "
        import glob, sys, zipfile
        names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
        sys.exit(0 if any('ghast/tests' in n for n in names) else 1)
        "; then
          echo "::error::wheel ships ghast/tests"
          exit 1
        fi
      shell: bash

  self-check:
    name: Self-check with Ghast
    permissions: read-all
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install ghast
      run: |
        python -m pip install --upgrade pip
        pip install -e .
      shell: bash

    - name: Run ghast on workflow files
      run: |
        ghast scan . --severity-threshold MEDIUM
      shell: bash


  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, lint, self-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.1
      with:
        persist-credentials: false

    - name: Configure GitHub Pages
      uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
      with:
        path: docs

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  build-and-publish:
    name: Build and publish Python distributions
    runs-on: ubuntu-latest
    needs: [test, lint, self-check, package]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
        
    permissions:
      contents: read
      # The only credential this job needs. PyPI exchanges this short-lived
      # OIDC token for an upload token scoped to this repository, workflow and
      # environment, so there is no long-lived API token to leak or rotate.
      id-token: write

    # Gives the release a place to require an approval or restrict which tags
    # may publish. Trusted publishing can be configured to demand it.
    environment:
      name: pypi
      url: https://pypi.org/p/ghast

    steps:
    - name: Checkout repository
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
      shell: bash

    - name: Build package
      run: |
        python -m build
      shell: bash

    - name: Check distribution metadata
      run: |
        python -m pip install --upgrade twine
        twine check --strict dist/*
      shell: bash

    # No `user`/`password`: with none supplied the action authenticates via
    # OIDC. The previous PYPI_API_TOKEN secret was a long-lived credential
    # with upload rights, which is the thing worth removing.
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        print-hash: true
