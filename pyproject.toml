[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghast"
version = "0.2.0"
description = "GitHub Actions Security Tool"
readme = "README.md"
authors = [
    {name = "Sean Evans", email = "sean.w.evans@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
keywords = ["github", "actions", "security", "workflows", "ci", "cd", "pipeline", "static-analysis", "linter"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0.3",
    "ruamel.yaml>=0.17.21",
    "colorama>=0.4.4; platform_system=='Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "flake8>=5.0.0",
    "mypy>=0.9.0",
    "types-PyYAML>=6.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "tomli>=2.0.0; python_version<'3.11'",
]

[project.urls]
"Homepage" = "https://github.com/seanwevans/ghast"
"Bug Tracker" = "https://github.com/seanwevans/ghast/issues"
"Documentation" = "https://github.com/seanwevans/ghast#readme"
"Source Code" = "https://github.com/seanwevans/ghast"

[project.scripts]
ghast = "ghast:main"

[tool.setuptools.packages.find]
include = ["ghast*"]
exclude = ["ghast.tests*"]

[tool.setuptools.package-data]
ghast = ["py.typed"]

[tool.black]
line-length = 100
# target-version is intentionally unset: black infers it from requires-python,
# so the supported range lives in exactly one place. Pinning py313 here makes
# black warn on every run for contributors on an older interpreter.
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ["ghast/tests"]

[tool.pytest.ini_options]
testpaths = ["ghast/tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"

[tool.coverage.run]
source = ["ghast"]
# Branch coverage, because line coverage was measuring the wrong thing. The
# suite reported 100% lines while 47 branches had only ever been taken in one
# direction, and five rule helpers that no code path could reach were fully
# "covered" by tests written to satisfy the target.
branch = true
omit = ["ghast/tests/*"]

[tool.coverage.report]
show_missing = true
# Only files with gaps, so the report is a to-do list rather than a wall.
skip_covered = true
# A floor, not a target. Set just under the current figure so a regression is
# caught, while leaving the remaining partial branches — mostly loop exits and
# defensive guards — to be closed by tests that have a reason to exist, rather
# than by tests written to move this number.
fail_under = 98
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.flake8]
max-line-length = 100
