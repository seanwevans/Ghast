# ghast configuration
#
# Every key below is a rule id, exactly as reported in findings and listed by
# `ghast rules`. Generate a fresh copy with:
#
#     ghast config --generate --output ghast.yml
#
permissions: true
poisoned_pipeline_execution: true
command_injection: true
environment_injection: false
token_security: true
action_pinning: true
timeout: true
shell_specification: true
workflow_name: true
deprecated_actions: true
continue_on_error: true
reusable_workflow_inputs: true
severity_thresholds:
  permissions: HIGH
  poisoned_pipeline_execution: CRITICAL
  command_injection: HIGH
  environment_injection: HIGH
  token_security: HIGH
  action_pinning: MEDIUM
  timeout: LOW
  shell_specification: LOW
  workflow_name: LOW
  deprecated_actions: MEDIUM
  continue_on_error: MEDIUM
  reusable_workflow_inputs: MEDIUM
auto_fix:
  enabled: true
  rules:
    permissions: true
    poisoned_pipeline_execution: false
    command_injection: false
    environment_injection: false
    token_security: true
    action_pinning: false
    timeout: true
    shell_specification: true
    workflow_name: true
    deprecated_actions: true
    continue_on_error: false
    reusable_workflow_inputs: false
default_timeout_minutes: 15
default_action_versions:
  actions/checkout@v1: actions/checkout@v3
  actions/checkout@v2: actions/checkout@v3
  actions/setup-python@v1: actions/setup-python@v4
  actions/setup-python@v2: actions/setup-python@v4
  actions/setup-node@v1: actions/setup-node@v3
  actions/setup-node@v2: actions/setup-node@v3
  actions/cache@v1: actions/cache@v3
  actions/cache@v2: actions/cache@v3
report:
  include_remediation: true
  show_context: true
  color_output: true
  verbose: false
  summary: true
